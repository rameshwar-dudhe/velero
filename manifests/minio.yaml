---
# =============================================================================
# MinIO — S3-compatible object storage used as Velero's Backup Storage Location
# =============================================================================
# This is the LOCAL/dev backup target. On a cloud cluster you delete this file
# entirely and point Velero at S3 / GCS / Azure Blob / DO Spaces instead.
#
# NOTE ON TOPOLOGY: MinIO runs *inside* the cluster it backs up. That is fine
# for a lab, but it means a total cluster loss takes the backups with it. See
# docs/03-production-notes.md for how to move the target off-cluster.
#
# Credentials are NOT in this file. They live in the `minio-root` Secret,
# created by scripts/gen-credentials.sh so no password is ever committed.
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: minio
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: velero-backup

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: minio
  labels:
    app.kubernetes.io/name: minio
spec:
  accessModes:
    - ReadWriteOnce
  # local-path-retain => reclaimPolicy: Retain, so deleting this PVC does NOT
  # delete the backup repository off the node's disk.
  storageClassName: local-path-retain
  resources:
    requests:
      storage: 20Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: minio
  labels:
    app.kubernetes.io/name: minio
spec:
  replicas: 1
  strategy:
    # A single RWO volume cannot be mounted by an old and new pod at once.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: minio
          image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
          imagePullPolicy: IfNotPresent
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: MINIO_ROOT_PASSWORD
            # Quieter startup; this is a single-node lab deployment.
            - name: MINIO_UPDATE
              value: "off"
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: s3
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data

---
# In-cluster address Velero uses: http://minio.minio.svc.cluster.local:9000
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: minio
  labels:
    app.kubernetes.io/name: minio
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: minio
  ports:
    - name: s3
      port: 9000
      targetPort: s3
    - name: console
      port: 9001
      targetPort: console

---
# Optional: reach MinIO from your workstation without port-forward, at
#   S3 API  -> http://<any-node-ip>:30900
#   Console -> http://<any-node-ip>:30901
# Delete this Service if you prefer `kubectl port-forward` only.
apiVersion: v1
kind: Service
metadata:
  name: minio-nodeport
  namespace: minio
  labels:
    app.kubernetes.io/name: minio
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: minio
  ports:
    - name: s3
      port: 9000
      targetPort: s3
      nodePort: 30900
    - name: console
      port: 9001
      targetPort: console
      nodePort: 30901

---
# One-shot Job that creates the `velero` bucket. Idempotent: safe to re-run.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-create-bucket
  namespace: minio
  labels:
    app.kubernetes.io/name: minio
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-create-bucket
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: mc
          image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: MINIO_ROOT_PASSWORD
            # The mc image ships HOME=/ , which uid 1000 cannot write, so mc
            # fails with "mkdir /.mc: permission denied". Point both HOME and
            # mc's config dir at the writable emptyDir mounted below.
            - name: HOME
              value: /tmp
            - name: MC_CONFIG_DIR
              value: /tmp/.mc
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              echo "waiting for MinIO to answer..."
              for i in $(seq 1 40); do
                if mc alias set local http://minio.minio.svc.cluster.local:9000 \
                     "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; then
                  break
                fi
                echo "  attempt $i failed, retrying in 3s..."
                sleep 3
              done
              echo "creating bucket 'velero' (ignore-existing)..."
              mc mb --ignore-existing local/velero
              echo "--- buckets ---"
              mc ls local
              echo "done."
          volumeMounts:
            - name: mc-config
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: mc-config
          emptyDir: {}
