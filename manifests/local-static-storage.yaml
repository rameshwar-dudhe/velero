---
# =============================================================================
# `local-static` StorageClass — the StorageClass whose volumes Velero CAN
# actually back up on this cluster.
# =============================================================================
# WHY THIS EXISTS
#
# local-path-provisioner (the default StorageClass) provisions PVs with a
# `hostPath` volume source. Velero's file system backup explicitly refuses those:
#
#   level=warning msg="Volume data in pod <ns>/<pod> is a hostPath volume
#   which is not supported for pod volume backup, skipping"
#
# The backup still reports Completed — the volume is skipped SILENTLY. You get
# the Kubernetes objects back on restore, and an empty volume.
#
# Velero accepts PVs with a `local` volume source, which is what the PVs below
# use. So: use `local-path` for throwaway data, and `local-static` for anything
# whose contents must survive a restore.
#
# TRADE-OFF: `local` PVs are not dynamically provisioned. You pre-create a pool
# of them (below) and PVCs bind to whatever is free. Add more PVs as needed.
#
# On a CLOUD cluster none of this applies — use the cloud CSI driver and CSI
# snapshots (see values/values-s3-generic.yaml).
# =============================================================================
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-static
provisioner: kubernetes.io/no-provisioner   # PVs are pre-created, not dynamic
volumeBindingMode: WaitForFirstConsumer     # bind only once a pod needs it,
                                            # so node affinity is respected
reclaimPolicy: Retain

---
# Creates the backing directories on the node. `local` PVs (unlike hostPath
# with DirectoryOrCreate) require the path to already exist, so this one-shot
# Job makes them. Runs as root because it writes under /opt on the host.
#
# Pinned to k8s-w-0: that is the only node without a NoSchedule taint, so it is
# where workloads (and therefore their volumes) land. Add a second Job with a
# different nodeSelector if you untaint the control-plane node.
apiVersion: batch/v1
kind: Job
metadata:
  name: local-static-mkdir
  namespace: local-path-storage
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        kubernetes.io/hostname: k8s-w-0
      containers:
        - name: mkdir
          image: docker.io/library/busybox:1.37
          securityContext:
            runAsUser: 0
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              for i in 1 2 3 4; do
                d="/host-opt/velero-local-pvs/pv-${i}"
                mkdir -p "$d"
                chmod 0777 "$d"
                echo "prepared $d"
              done
              ls -la /host-opt/velero-local-pvs
          volumeMounts:
            - name: host-opt
              mountPath: /host-opt
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
      volumes:
        - name: host-opt
          hostPath:
            path: /opt
            type: DirectoryOrCreate

---
# A pool of 4 static `local` PVs. The demo uses one; the spares matter because
# a Velero RESTORE creates a brand-new PVC that must bind to a FREE PV — the
# original PV is left behind in `Released` state and will not rebind on its own.
# Without spares, restores of PVC-backed apps stay Pending forever.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: local-static-pv-1
  labels:
    velero.io/pv-pool: local-static
spec:
  capacity:
    storage: 1Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-static
  volumeMode: Filesystem
  local:
    path: /opt/velero-local-pvs/pv-1
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: ["k8s-w-0"]

